<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TimingCalc</title>
    <base href="/" />
    <style>
        html, body {
            background-color: #FFFFFF !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Il vero Splash Screen Overlay - Copre tutto */
        #custom-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease; /* Sfumatura dolce quando sparisce */
        }

        /* L'app vera e propria starà sotto */
        #app {
            background-color: #121212 !important;
            height: 100vh;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .pro-splash-logo {
            width: 75%;
            max-width: 450px;
            /* Fa 1 battito al secondo, così in 3 secondi ne vedi 3 completi */
            animation: pulse 0.5s infinite ease-in-out;
            will-change: transform;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="TimingCalc.styles.css" />
</head>
<body>

    <div id="custom-splash">
        <img src="images/splash_logo.png" class="pro-splash-logo" alt="TimingCalc" />
    </div>

    <div id="app"></div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('custom-splash');
            if (splash) {
                splash.style.opacity = '0'; // Avvia la sfumatura CSS
                setTimeout(() => splash.remove(), 500); // Rimuove il div dopo mezzo secondo di fade
            }
        }, 4000); // Cambia questo 3000 se vuoi più o meno tempo
    </script>
</body>
</html>
